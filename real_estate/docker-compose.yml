version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: boat_storage_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boat_storage_db}
      POSTGRES_USER: ${POSTGRES_USER:-boat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boat}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boat} -d ${POSTGRES_DB:-boat_storage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
    name: boat_storage_pgdata
